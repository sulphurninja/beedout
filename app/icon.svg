<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- BeedOut monogram: custom geometric "B." — flat left spine, rounded
       right bowls, mango full-stop. Drawn as shapes, not a font glyph. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#241d15"/>
      <stop offset="1" stop-color="#120e0a"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#tile)"/>
  <!-- upper bowl -->
  <rect x="14" y="13" width="30" height="18" rx="9" fill="#fbf8f1"/>
  <!-- lower bowl -->
  <rect x="14" y="31" width="33" height="20" rx="10" fill="#fbf8f1"/>
  <!-- flat spine (squares off the left edge) -->
  <rect x="14" y="13" width="11" height="38" fill="#fbf8f1"/>
  <!-- counters -->
  <rect x="25" y="18.5" width="13" height="7.5" rx="3.75" fill="#181410"/>
  <rect x="25" y="37" width="15.5" height="8" rx="4" fill="#181410"/>
  <!-- full stop -->
  <circle cx="53.5" cy="46.5" r="4.5" fill="#ff4d00"/>
</svg>
